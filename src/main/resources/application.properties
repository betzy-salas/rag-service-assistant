spring.application.name=assistant
server.port=8081

# Configuration and secrets come from Consul, under config/assistant/, shared with the ingestion service.
spring.config.import=consul:
spring.cloud.consul.host=localhost
spring.cloud.consul.port=8500
spring.cloud.consul.config.name=assistant

management.endpoint.health.show-details=always
# Prometheus (docker compose of the project) scrapes /actuator/prometheus; metrics helps to inspect a value by hand.
management.endpoints.web.exposure.include=health,metrics,prometheus
# Actuator has its own CORS settings; reuse the front-end origins so the client can show the service health.
management.endpoints.web.cors.allowed-origins=${app.cors.allowed-origins:http://localhost:5173}
management.endpoints.web.cors.allowed-methods=GET
